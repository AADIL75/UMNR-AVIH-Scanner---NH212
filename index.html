<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#00146E" />
<title>ANA Scan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%2300146E'/%3E%3Cpath d='M32 12l4 14 14 4-14 4-4 14-4-14-14-4 14-4z' fill='%2300AFF0'/%3E%3C/svg%3E" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    /* ANA corporate palette (from official brand color guidelines) */
    --triton-blue: #00146E;
    --mohican-blue: #00AFF0;
    --support-blue-dark: #0F2356;
    --support-blue-light: #CCD4EA;
    --accent-red: #ED2F4F;
    --accent-red-dark: #C81F3C;
    --gray-100: #E5E5E5;
    --gray-300: #B2B2B2;
    --gray-500: #7F7F7F;
    --gray-800: #333333;
    --white: #FFFFFF;

    --bg: #F2F6FC;
    --card: #ffffff;
    --border: #E1E8F5;
    --text: var(--gray-800);
    --muted: var(--gray-500);
    --brand-gradient: linear-gradient(135deg, var(--triton-blue) 0%, var(--mohican-blue) 100%);
    --app-max-width: 480px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: var(--app-max-width);
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Tablets / larger screens: the 480px phone-width cap left large unused
     margins on iPad. Widen the whole app (header, cards, bottom bar all
     read the same --app-max-width variable, so they stay in sync) using a
     fluid width tied to the actual viewport — rather than one fixed pixel
     value — so it genuinely scales with device resolution: a bit wider on
     a portrait iPad, wider still in landscape or on an iPad Pro, capped
     only so lines of text don't get absurd on a desktop monitor. */
  @media (min-width: 700px) {
    :root { --app-max-width: min(94vw, 1100px); }
    .thumbs { grid-template-columns: repeat(4, 1fr); }
    .card { padding: 22px 26px; }
    .main-content { padding: 22px 26px 24px; }
    header { padding: calc(20px + env(safe-area-inset-top)) 28px 24px; }
  }
  @media (min-width: 1000px) {
    .thumbs { grid-template-columns: repeat(5, 1fr); }
  }

  /* ---------- Header ---------- */
  header {
    background: var(--brand-gradient);
    color: #fff;
    padding: calc(18px + env(safe-area-inset-top)) 20px 22px;
    position: sticky;
    top: 0;
    z-index: 20;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2260%22%20height%3D%2260%22%20viewBox%3D%220%200%2024%2024%22%3E%3Cg%20transform%3D%22translate%2812%2C12%29%20rotate%2845%29%20translate%28-12%2C-12%29%22%3E%3Cpath%20d%3D%22M21%2016v-2l-8-5V3.5C13%202.67%2012.33%202%2011.5%202S10%202.67%2010%203.5V9l-8%205v2l8-2.5V19l-2.5%201.5V22l4-1%204%201v-1.5L13%2019v-5.5z%22%20fill%3D%22white%22%20fill-opacity%3D%220.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");
    background-size: 60px 60px;
    opacity: 0.5;
    pointer-events: none;
  }
  header .plane-trail {
    position: absolute;
    right: -10px;
    top: -10px;
    opacity: 0.18;
    width: 130px;
    height: 130px;
    pointer-events: none;
    animation: planeFly 1100ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes planeFly {
    0% { transform: translate(36px, -22px) scale(0.7); opacity: 0; }
    60% { opacity: 0.22; }
    100% { transform: translate(0, 0) scale(1); opacity: 0.18; }
  }
  .brand-row { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.35);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  header h1 { font-size: 19px; margin: 0; font-weight: 800; letter-spacing: 0.2px; }
  header .tagline { font-size: 12px; opacity: 0.85; margin-top: 1px; }

  .main-content { padding: 18px 16px 8px; }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Cards ---------- */
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 1px 2px rgba(15, 35, 86, 0.06), 0 6px 20px rgba(15, 35, 86, 0.06);
    margin-top: 16px;
    border: 1px solid var(--border);
    animation: fadeSlideUp 420ms cubic-bezier(.2,.8,.2,1) both;
  }
  .card:nth-of-type(1) { animation-delay: 40ms; }
  .card:nth-of-type(2) { animation-delay: 120ms; }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--triton-blue);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-title-icon {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--support-blue-light), #E4EBFB);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .card-title-icon svg { width: 13px; height: 13px; flex-shrink: 0; }
  .badge {
    background: var(--mohican-blue);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
  }

  label { font-size: 12.5px; font-weight: 700; display: block; margin-bottom: 6px; margin-top: 14px; color: var(--support-blue-dark); }
  label:first-of-type { margin-top: 0; }
  .field-icon-row { display: flex; align-items: center; gap: 5px; }
  .field-icon-row svg { width: 13px; height: 13px; color: var(--mohican-blue); flex-shrink: 0; }

  input[type="text"], input[type="email"], input[type="date"], textarea {
    width: 100%;
    height: 46px;
    padding: 0 12px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    line-height: 1;
    font-family: inherit;
    background: #fbfcfe;
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea { height: auto; padding: 11px 12px; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--mohican-blue);
    box-shadow: 0 0 0 3px rgba(0, 175, 240, 0.15);
  }
  input.field-error {
    border-color: var(--accent-red);
    box-shadow: 0 0 0 3px rgba(237, 47, 79, 0.15);
  }
  .hint { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.4; }
  .required-mark { color: var(--accent-red); margin-left: 2px; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-row > div { min-width: 0; }
  input[type="date"] { min-width: 0; }

  /* ---------- Buttons ---------- */
  .photo-actions { display: flex; gap: 10px; margin-top: 14px; }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform 0.08s ease, box-shadow 0.15s ease, opacity 0.15s;
    font-family: inherit;
  }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn:active { transform: scale(0.96); }
  .btn-primary {
    background: var(--mohican-blue);
    color: #fff;
    flex: 1;
    box-shadow: 0 4px 12px rgba(0, 175, 240, 0.35);
  }
  .btn-outline {
    background: #fff;
    color: var(--triton-blue);
    border: 1.5px solid var(--support-blue-light);
    flex: 1;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn .spin { animation: spin 0.85s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Thumbnails ---------- */
  .thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 3/4;
    border-radius: 12px;
    overflow: hidden;
    border: 2px solid var(--support-blue-light);
    background: #f0f1f3;
    box-shadow: 0 2px 8px rgba(15, 35, 86, 0.10);
    animation: thumbIn 260ms cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes thumbIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .page-num {
    position: absolute;
    top: 5px;
    left: 5px;
    background: var(--triton-blue);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
  }
  .thumb .remove-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: var(--accent-red);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .thumb .move-btns {
    position: absolute;
    bottom: 5px;
    right: 5px;
    display: flex;
    gap: 4px;
  }
  .thumb .move-btns button {
    background: rgba(0,20,110,0.7);
    color: #fff;
    border: none;
    border-radius: 6px;
    width: 22px;
    height: 22px;
    font-size: 12px;
    cursor: pointer;
  }
  .thumb .move-btns button:disabled { opacity: 0.35; }

  .empty-state {
    text-align: center;
    padding: 30px 20px 26px;
    color: var(--muted);
    font-size: 13.5px;
    border: 2px dashed var(--support-blue-light);
    border-radius: 14px;
    background: linear-gradient(180deg, #F7FAFF 0%, #F2F6FC 100%);
  }
  .empty-icon-chip {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mohican-blue), var(--triton-blue));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 10px;
    box-shadow: 0 6px 14px rgba(0, 175, 240, 0.3);
  }
  .empty-icon-chip svg { width: 26px; height: 26px; color: #fff; }

  /* ---------- Filename preview (boarding-pass style) ---------- */
  .ticket-preview {
    margin-top: 16px;
    position: relative;
    background: linear-gradient(135deg, var(--support-blue-light) 0%, #E4EBF9 100%);
    border: 1.5px dashed var(--triton-blue);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: visible;
  }
  .ticket-preview::before, .ticket-preview::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    background: var(--card);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .ticket-preview::before { left: -9px; }
  .ticket-preview::after { right: -9px; }
  .ticket-preview svg { width: 20px; height: 20px; color: var(--triton-blue); flex-shrink: 0; }
  .ticket-preview .ticket-text {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--triton-blue);
    letter-spacing: 0.2px;
    word-break: break-word;
  }
  .ticket-preview .ticket-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--support-blue-dark);
    opacity: 0.7;
    display: block;
    margin-bottom: 2px;
  }

  /* ---------- Sticky bottom CTA ---------- */
  .bottom-bar {
    /* Normal document flow, directly after the cards — not fixed to the
       viewport. A fixed bar combined with a flex-grown content area meant
       the app always stretched to fill the full screen height, which on
       a short form + tall iPad screen left a large empty gap between the
       last field and the button. This way the button just sits right
       after the form; any leftover space on a tall screen lands below it
       instead of awkwardly above it. */
    position: relative;
    max-width: var(--app-max-width);
    margin: 8px auto 0;
    background: transparent;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  .bottom-bar::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--brand-gradient);
  }
  .btn-cta {
    width: 100%;
    background: linear-gradient(135deg, var(--accent-red) 0%, var(--accent-red-dark) 100%);
    color: #fff;
    padding: 15px 16px;
    font-size: 16px;
    box-shadow: 0 6px 16px rgba(237, 47, 79, 0.35);
  }

  /* ---------- Status banner ---------- */
  .status-banner {
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 12px;
    font-size: 13px;
    display: none;
    line-height: 1.5;
    align-items: flex-start;
    gap: 8px;
  }
  .status-banner.visible { display: flex; }
  .status-banner svg { width: 17px; height: 17px; flex-shrink: 0; margin-top: 1px; }
  .status-banner.info { background: #E7F6FE; color: var(--triton-blue); }
  .status-banner.success { background: #E6F8EF; color: #157347; }
  .status-banner.error { background: #FDEAEC; color: var(--accent-red-dark); }
  .status-banner a { color: inherit; font-weight: 700; text-decoration: underline; }

  #cameraInput, #uploadInput { display: none; }

  /* capture flash feedback */
  .flash-overlay {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
  }
  .flash-overlay.flash { animation: flashPulse 320ms ease-out; }
  @keyframes flashPulse {
    0% { opacity: 0.85; }
    100% { opacity: 0; }
  }


</style>
</head>
<body>
<div class="app">
  <div class="flash-overlay" id="flashOverlay"></div>

  <header>
    <svg class="plane-trail" viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg>
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg>
      </div>
      <div>
        <h1>ANA Scan</h1>
        <div class="tagline">Document Scanner &middot; NH Flight Ops</div>
      </div>
    </div>
  </header>

  <div class="main-content">

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="card-title-icon"><svg viewBox="0 0 24 24" fill="none" stroke="var(--triton-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></span>
          Document photos
        </div>
        <span class="badge" id="pageCountBadge">0 pages</span>
      </div>

      <div class="thumbs" id="thumbGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon-chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div>No pages yet — tap <strong>Take Photo</strong> to capture the first page.</div>
      </div>

      <div class="photo-actions">
        <button class="btn btn-primary" id="takePhotoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Take Photo
        </button>
        <button class="btn btn-outline" id="uploadPhotoBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          Upload
        </button>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" />
      <input type="file" id="uploadInput" accept="image/*" multiple />
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">
          <span class="card-title-icon"><svg viewBox="0 0 24 24" fill="var(--triton-blue)"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg></span>
          Flight details
        </div>
      </div>

      <div class="field-row">
        <div>
          <label for="flightNumber"><span class="field-icon-row"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg>Flight number</span></label>
          <input type="text" id="flightNumber" placeholder="e.g. NH212" />
        </div>
        <div>
          <label for="scanDate"><span class="field-icon-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Date</span></label>
          <input type="date" id="scanDate" />
        </div>
      </div>

      <label for="paxName"><span class="field-icon-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Pax name<span class="required-mark">*</span></span></label>
      <input type="text" id="paxName" placeholder="e.g. KURATA KEI MSTR" style="text-transform:uppercase;" required />
      <div class="hint">Enter surname, first name, and title exactly as it should appear (e.g. SHIROYAMA TAISEI MR).</div>

      <div class="ticket-preview">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2.5 1.5V22l4-1 4 1v-1.5L13 19v-5.5z"/></svg>
        <div>
          <span class="ticket-label">File name</span>
          <span class="ticket-text" id="fileNamePreview">—</span>
        </div>
      </div>
    </div>

    <div id="statusBanner" class="status-banner"></div>
  </div>

  <div class="bottom-bar">
    <button class="btn btn-cta" id="sendBtn">
      <span id="sendBtnIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <span id="sendBtnLabel">Upload to Drive</span>
    </button>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURATION — paste your deployed Apps Script Web App URL
   (see Code.gs / README.md for how to create this). It should
   end in /exec.
   ========================================================= */
const APPS_SCRIPT_URL = "https://script.google.com/a/macros/ana.co.jp/s/AKfycbxh8USJCVyxGKSeL5ATSTdhbQ00XXjM032imsZe8pq_MGZWdglEgyFe3HQOpUdTwzBA/exec";

/* =========================================================
   State
   ========================================================= */
let photos = []; // { dataUrl, mimeType }

/* =========================================================
   DOM refs
   ========================================================= */
const thumbGrid = document.getElementById("thumbGrid");
const emptyState = document.getElementById("emptyState");
const pageCountBadge = document.getElementById("pageCountBadge");
const takePhotoBtn = document.getElementById("takePhotoBtn");
const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
const cameraInput = document.getElementById("cameraInput");
const uploadInput = document.getElementById("uploadInput");
const flightNumberInput = document.getElementById("flightNumber");
const scanDateInput = document.getElementById("scanDate");
const paxNameInput = document.getElementById("paxName");
const fileNamePreview = document.getElementById("fileNamePreview");
const sendBtn = document.getElementById("sendBtn");
const statusBanner = document.getElementById("statusBanner");
const flashOverlay = document.getElementById("flashOverlay");

/* =========================================================
   Filename auto-format: "<FLIGHT> <DDMMMYY> <PAX NAME>.pdf"
   e.g. "NH212 04AUG26 KURATA KEI MSTR.pdf"
   ========================================================= */
const DEFAULT_FLIGHT_NUMBER = "NH212";
const MONTH_ABBR = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

function initDefaults() {
  flightNumberInput.value = DEFAULT_FLIGHT_NUMBER;
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, "0");
  const dd = String(today.getDate()).padStart(2, "0");
  scanDateInput.value = `${yyyy}-${mm}-${dd}`; // native date input format
  updateFileNamePreview();
}

function formatDateForFileName(dateInputValue) {
  if (!dateInputValue) return "";
  const [y, m, d] = dateInputValue.split("-").map(Number);
  const dt = new Date(y, m - 1, d); // local time, avoids UTC off-by-one
  const dd = String(dt.getDate()).padStart(2, "0");
  const mon = MONTH_ABBR[dt.getMonth()];
  const yy = String(dt.getFullYear()).slice(-2);
  return `${dd}${mon}${yy}`;
}

function buildFileName() {
  const flight = flightNumberInput.value.trim().toUpperCase();
  const dateStr = formatDateForFileName(scanDateInput.value);
  const pax = paxNameInput.value.trim().toUpperCase();
  const parts = [flight, dateStr, pax].filter(Boolean);
  return sanitizeFileName(parts.join(" "));
}

function updateFileNamePreview() {
  const name = buildFileName();
  fileNamePreview.textContent = name ? `${name}.pdf` : "—";
}

[flightNumberInput, scanDateInput, paxNameInput].forEach((el) => {
  el.addEventListener("input", updateFileNamePreview);
  el.addEventListener("change", updateFileNamePreview);
});

/* =========================================================
   Photo capture / management
   ========================================================= */
takePhotoBtn.addEventListener("click", () => cameraInput.click());
uploadPhotoBtn.addEventListener("click", () => uploadInput.click());

cameraInput.addEventListener("change", (e) => handleFiles(e.target.files));
uploadInput.addEventListener("change", (e) => handleFiles(e.target.files));

function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  files.forEach((file) => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      photos.push({ dataUrl: ev.target.result, mimeType: file.type });
      triggerFlash();
      renderThumbs();
    };
    reader.readAsDataURL(file);
  });
  cameraInput.value = "";
  uploadInput.value = "";
}

function triggerFlash() {
  flashOverlay.classList.remove("flash");
  // force reflow so the animation can restart on rapid captures
  void flashOverlay.offsetWidth;
  flashOverlay.classList.add("flash");
}

function renderThumbs() {
  emptyState.style.display = photos.length ? "none" : "block";
  pageCountBadge.textContent = photos.length === 1 ? "1 page" : `${photos.length} pages`;
  thumbGrid.innerHTML = "";
  photos.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "thumb";
    div.innerHTML = `
      <img src="${p.dataUrl}" alt="page ${i + 1}">
      <span class="page-num">${i + 1}</span>
      <button class="remove-btn" data-i="${i}" title="Remove">&times;</button>
      <div class="move-btns">
        <button data-move="left" data-i="${i}" ${i === 0 ? "disabled" : ""}>&#8592;</button>
        <button data-move="right" data-i="${i}" ${i === photos.length - 1 ? "disabled" : ""}>&#8594;</button>
      </div>
    `;
    thumbGrid.appendChild(div);
  });

  thumbGrid.querySelectorAll(".remove-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      photos.splice(Number(btn.dataset.i), 1);
      renderThumbs();
    });
  });
  thumbGrid.querySelectorAll("[data-move]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.i);
      const dir = btn.dataset.move === "left" ? -1 : 1;
      const j = i + dir;
      if (j < 0 || j >= photos.length) return;
      [photos[i], photos[j]] = [photos[j], photos[i]];
      renderThumbs();
    });
  });
}
renderThumbs();
initDefaults();

/* =========================================================
   PDF generation
   ========================================================= */
// Rather than forcing every photo onto a fixed A4 page (which leaves a
// margin PLUS letterboxing whenever the photo's aspect ratio doesn't
// exactly match A4), each page is sized to match that photo's own
// aspect ratio and the image is drawn edge-to-edge. Pixel dimensions are
// converted to PDF points at PAGE_DPI, a reasonable resolution for a
// scanned document. Net result: no white border at all.
const PAGE_DPI = 150;

async function buildPdf() {
  const { jsPDF } = window.jspdf;
  let pdf = null;

  for (let i = 0; i < photos.length; i++) {
    const rawImg = await loadImage(photos[i].dataUrl);
    const oriented = toOrientedJpeg(rawImg);

    const pageW = (oriented.width / PAGE_DPI) * 72;
    const pageH = (oriented.height / PAGE_DPI) * 72;
    const pageOrientation = pageW >= pageH ? "l" : "p";

    if (i === 0) {
      pdf = new jsPDF({ unit: "pt", format: [pageW, pageH], orientation: pageOrientation });
    } else {
      pdf.addPage([pageW, pageH], pageOrientation);
    }
    pdf.addImage(oriented.dataUrl, "JPEG", 0, 0, pageW, pageH, undefined, "FAST");
  }

  return pdf; // caller decides output format (blob / save / datauri)
}

function loadImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Phone photos are often stored as raw (landscape) sensor pixels plus an
// EXIF "Orientation" tag telling viewers to rotate them for display.
// jsPDF embeds the original JPEG bytes as-is and does NOT read that tag,
// so passing the raw photo straight through produces sideways pages.
// Drawing the already-loaded <img> onto a canvas sidesteps this: the
// browser's own decoder applies the EXIF rotation when painting, so the
// canvas — and the JPEG we re-export from it — end up correctly oriented
// with no rotation metadata left to misinterpret. This also downscales
// oversized photos so the PDF doesn't balloon in size. Kept fairly
// aggressive (1600px / 0.72 quality) because every extra MB here directly
// adds to the upload's transfer + base64-decode time on the Apps Script
// side — for scanned text documents this is still easily sharp enough
// to read, but noticeably faster to upload than a full-resolution photo.
function toOrientedJpeg(img, maxDim = 1600, quality = 0.72) {
  let w = img.naturalWidth;
  let h = img.naturalHeight;
  if (Math.max(w, h) > maxDim) {
    const scale = maxDim / Math.max(w, h);
    w = Math.round(w * scale);
    h = Math.round(h * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  return { dataUrl: canvas.toDataURL("image/jpeg", quality), width: w, height: h };
}

/* =========================================================
   Send flow — uploads the PDF straight to a shared Google
   Drive folder via a Google Apps Script Web App endpoint.
   No address to enter, no OAuth in this app, no cloud
   project: the script owner's account already has access to
   the folder and does the writing on the app's behalf.

   Because the deployment is restricted to "Anyone within the
   organization," the request needs to carry the staff member's
   normal Google login session. A background fetch() can't do
   that reliably (Google's login redirect isn't CORS-friendly),
   so instead we submit a real HTML form to a new tab — an
   ordinary browser navigation, which handles the org login
   exactly like clicking any other internal link.
   ========================================================= */
sendBtn.addEventListener("click", async () => {
  paxNameInput.classList.remove("field-error");
  flightNumberInput.classList.remove("field-error");
  scanDateInput.classList.remove("field-error");

  if (!photos.length) return showStatus("error", "Add at least one photo first.");
  if (!paxNameInput.value.trim()) return flagRequiredField(paxNameInput, "Pax name is required before you can upload.");
  if (!flightNumberInput.value.trim()) return flagRequiredField(flightNumberInput, "Enter the flight number.");
  if (!scanDateInput.value) return flagRequiredField(scanDateInput, "Pick a date.");
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.startsWith("PASTE_")) {
    return showStatus("error", "This app hasn't been configured with a Drive upload endpoint yet. See README.md.");
  }

  const fileName = buildFileName() + ".pdf";

  // Open the tab RIGHT HERE — synchronously, still inside the click
  // handler's original call stack — pointed straight at the Apps Script
  // URL so it starts loading immediately (and shows its own instant
  // "Uploading..." page). This has to happen before the first `await`
  // below: once we cross an await, the browser no longer considers what
  // follows part of the original trusted click, and Safari in particular
  // will silently block a window.open() called from that point on,
  // undoing the whole point of this flow. Opening it now also means the
  // tab is loading in parallel with the PDF build instead of after it.
  const popup = window.open(APPS_SCRIPT_URL, UPLOAD_WINDOW_NAME);

  sendBtn.disabled = true;
  setSendBtnLoading(true, "Building…");
  showStatus("info", "Building PDF…");

  try {
    const pdf = await buildPdf();
    const pdfBase64 = pdf.output("datauristring").split(",")[1];

    setSendBtnLoading(true, "Uploading…");
    showStatus("info", "Uploading…");
    submitToDrive({ fileName, pdfBase64, popup });

    showStatus(
      "success",
      `"${fileName}" is uploading in a new tab — check that tab to confirm it saved to Drive, then you can close it.`
    );
    resetForm();
  } catch (err) {
    console.error(err);
    showStatus("error", "Something went wrong: " + (err.message || err));
  } finally {
    sendBtn.disabled = false;
    setSendBtnLoading(false);
  }
});

const SEND_BTN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>';
const SEND_BTN_SPINNER = '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>';
const sendBtnIcon = document.getElementById("sendBtnIcon");
const sendBtnLabel = document.getElementById("sendBtnLabel");

function setSendBtnLoading(isLoading, label) {
  sendBtnIcon.innerHTML = isLoading ? SEND_BTN_SPINNER : SEND_BTN_ICON;
  sendBtnLabel.textContent = isLoading ? label : "Upload to Drive";
}

// Named window so both the initial open() and the fallback form submit
// below target the SAME tab rather than opening a second one.
const UPLOAD_WINDOW_NAME = "ana_scan_upload";

function submitToDrive({ fileName, pdfBase64, popup }) {
  // The tab (Apps Script's doGet response) was already opened synchronously
  // back in the click handler. Here we just hand it the actual file data
  // once it signals it's ready to receive it, via postMessage — it then
  // uploads the data itself with its own fetch() call.
  if (!popup || popup.closed) {
    // Popup was blocked or the user closed it — fall back to a direct submit.
    submitToDriveViaForm({ fileName, pdfBase64 });
    return;
  }

  let handled = false;
  function onMessage(event) {
    if (event.source !== popup || event.data !== "ana-scan-ready") return;
    handled = true;
    window.removeEventListener("message", onMessage);
    popup.postMessage({ fileName, pdfBase64 }, "*");
  }
  window.addEventListener("message", onMessage);

  // Safety net: if the popup never signals it's ready (e.g. an older
  // cached deployment without this handshake, or the message gets lost),
  // fall back to submitting the payload directly into that same tab
  // after a short grace period, so the upload still completes either way.
  setTimeout(() => {
    if (handled) return;
    window.removeEventListener("message", onMessage);
    submitToDriveViaForm({ fileName, pdfBase64 });
  }, 4000);
}

function submitToDriveViaForm({ fileName, pdfBase64 }) {
  const form = document.createElement("form");
  form.method = "POST";
  form.action = APPS_SCRIPT_URL;
  form.target = UPLOAD_WINDOW_NAME;
  form.style.display = "none";

  const addField = (name, value) => {
    const input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = value;
    form.appendChild(input);
  };
  addField("fileName", fileName);
  addField("pdfBase64", pdfBase64);

  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);
}

function resetForm() {
  photos = [];
  renderThumbs();
  paxNameInput.value = "";
  paxNameInput.focus();
  updateFileNamePreview();
}

function sanitizeFileName(name) {
  return name.replace(/[\\/:*?"<>|]/g, "-").slice(0, 150);
}

const STATUS_ICONS = {
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
};

function flagRequiredField(el, message) {
  el.classList.add("field-error");
  el.focus();
  showStatus("error", message);
}

[paxNameInput, flightNumberInput, scanDateInput].forEach((el) => {
  el.addEventListener("input", () => el.classList.remove("field-error"));
  el.addEventListener("change", () => el.classList.remove("field-error"));
});

function showStatus(type, msg) {
  statusBanner.className = "status-banner visible " + type;
  statusBanner.innerHTML = (STATUS_ICONS[type] || "") + "<div>" + msg + "</div>";
}
</script>
</body>
</html>
